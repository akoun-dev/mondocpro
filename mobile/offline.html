<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mon doc Pro — Hors ligne</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #f8fafc; color: #0f172a;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 32px; text-align: center;
      }
      .icon { font-size: 52px; }
      h1 { font-size: 20px; font-weight: 700; }
      p { font-size: 14px; color: #475569; max-width: 320px; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 12px 28px; border: none; border-radius: 12px;
        background: #0f766e; color: #fff; font-size: 15px; font-weight: 600;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="icon">📡</div>
    <h1>Connexion indisponible</h1>
    <p>
      Vérifiez votre connexion internet (données mobiles ou Wi-Fi) puis
      réessayez. Vos données restent sécurisées sur le serveur.
    </p>
    <button onclick="location.reload()">Réessayer</button>
  </body>
</html>
