<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mon doc Pro — Chargement…</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0f766e; color: #ffffff;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .logo {
        width: 84px; height: 84px; border-radius: 22px; background: #ffffff;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: #0f766e;
      }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
      p { font-size: 14px; opacity: 0.85; }
      .spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #ffffff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="logo">M</div>
    <h1>Mon doc Pro</h1>
    <p>Connexion au serveur sécurisé…</p>
    <div class="spinner"></div>
  </body>
</html>
